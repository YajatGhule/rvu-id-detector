<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Settings - RVU ID Card Detector</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>RVU ID Card Detector</h1>

    <p class="menu">
      <a href="index.html">Home</a> |
      <a href="upload.html">Upload</a> |
      <a href="history.html">History</a> |
      <a href="settings.html">Settings</a> |
      <a href="about.html">About</a>
    </p>
    <hr />

    <h2>Settings</h2>
    <p>Change the values and press Save.</p>

    <form method="post" action="http://127.0.0.1:8000/api/settings">
      <table>
        <tr>
          <td><label for="band_color">Band colour of the ID card</label></td>
          <td><input type="color" id="band_color" name="band_color" value="#1e40af" /></td>
        </tr>
        <tr>
          <td><label for="tolerance">Colour tolerance (5 to 80)</label></td>
          <td><input type="number" id="tolerance" name="tolerance" min="5" max="80" value="25" /></td>
        </tr>
        <tr>
          <td><label for="on_threshold">Score needed for WEARING (0 to 1)</label></td>
          <td><input type="number" id="on_threshold" name="on_threshold" min="0" max="1" step="0.05" value="0.6" /></td>
        </tr>
        <tr>
          <td><label for="off_threshold">Score for NOT WEARING (0 to 1)</label></td>
          <td><input type="number" id="off_threshold" name="off_threshold" min="0" max="1" step="0.05" value="0.35" /></td>
        </tr>
        <tr>
          <td><label for="violation_seconds">Seconds before it is saved in History</label></td>
          <td><input type="number" id="violation_seconds" name="violation_seconds" min="0" step="0.5" value="3.0" /></td>
        </tr>
        <tr>
          <td><label for="person_conf">Person confidence (0 to 1)</label></td>
          <td><input type="number" id="person_conf" name="person_conf" min="0" max="1" step="0.05" value="0.4" /></td>
        </tr>
        <tr>
          <td><label for="camera">Camera number (0 is the first webcam)</label></td>
          <td><input type="text" id="camera" name="camera" value="0" /></td>
        </tr>
        <tr>
          <td><label for="device">Run on</label></td>
          <td>
            <select id="device" name="device">
              <option value="auto">auto</option>
              <option value="cpu">cpu</option>
              <option value="cuda">cuda</option>
              <option value="directml">directml</option>
              <option value="openvino">openvino</option>
              <option value="coreml">coreml</option>
            </select>
          </td>
        </tr>
      </table>

      <p>
        <input type="submit" value="Save" />
      </p>
    </form>

    <hr />
    <p class="footer">Web Technology project. Everything runs on this computer.</p>
  </body>
</html>
